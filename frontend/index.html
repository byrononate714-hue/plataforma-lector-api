<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector+ | Etapa 2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra de Navegación -->
    <nav class="navbar">
        <h2>Lector+</h2>
        <div id="userPanel">
            <!-- Aquí se insertará el nombre del usuario al iniciar sesión -->
        </div>
    </nav>

    <!-- Pantalla de Inicio de Sesión -->
    <div id="loginFormContainer" class="container">
        <div class="sidebar" style="width: 100%; max-width: 400px; margin: 2rem auto;">
            <h3 style="margin-top: 0;">Iniciar Sesión</h3>
            <div class="filter-group">
                <label>Correo Electrónico:</label>
                <input type="email" id="loginCorreo" placeholder="juan@email.com" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; box-sizing: border-box;">
            </div>
            <div class="filter-group">
                <label>Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="hash_seguro_123" style="width: 100%; padding: 0.5rem; margin-top: 0.5rem; box-sizing: border-box;">
            </div>
            <button id="btnLogin" class="btn-primary">Ingresar</button>
        </div>
    </div>

    <!-- Pantalla Principal (Buscador y Catálogo) -->
    <div id="appContainer" class="container hidden">
        <!-- Panel de Filtros -->
        <aside class="sidebar">
            <h3 style="margin-top: 0;">Filtros de Búsqueda</h3>
            <div class="filter-group">
                <label for="etiqueta">Etiqueta (Obligatorio):</label>
                <select id="etiqueta">
                    <option value="">Seleccione...</option>
                    <option value="Ingeniería">Ingeniería</option>
                    <option value="Fantasía">Fantasía</option>
                </select>
            </div>
            <button id="btnBuscar" class="btn-primary">Buscar Contenido</button>
            <hr style="margin: 1.5rem 0; border: 0; border-top: 1px solid #eee;">
            <button id="btnLogout" class="btn-primary" style="background: #e74c3c;">Cerrar Sesión</button>
        </aside>
        
        <!-- Grilla de Resultados -->
        <main class="content-area">
            <div id="resultadosGrid" class="grid-container">
                <p class="empty-msg">Utiliza los filtros de la izquierda para buscar material bibliográfico.</p>
            </div>
        </main>
    </div>

    <!-- Contenedor para Notificaciones Flotantes (Toast) -->
    <div id="toast" class="toast hidden"></div>

    <!-- Lógica de la aplicación -->
    <script src="app.js"></script>
</body>
</html>
